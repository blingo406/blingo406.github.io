name: Refresh public market data

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-market-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.snapshot.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/markets/requirements.txt
      - name: Install collector dependencies
        run: pip install -r scripts/markets/requirements.txt
      - name: Test source parsers and export boundary
        run: python -m unittest discover -s scripts/markets -p 'test_*.py'
      - name: Refresh external sources
        run: |
          set +e
          python scripts/markets/refresh.py
          result=$?
          set -e
          if [ "$result" -eq 2 ]; then
            echo '::warning::All sources unavailable; publishing previous records with current failure statuses.'
          else
            exit "$result"
          fi
      - name: Validate refreshed snapshot
        run: python -m unittest discover -s scripts/markets -p 'test_*.py'
      - name: Save public snapshot only
        id: snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/data/markets/snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh public market sources'
            git push origin HEAD:main
          fi
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: refresh
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.refresh.outputs.ref }}
